<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How UIF credit days build up</title>
  <desc id="d">For every 4 days you work and contribute to UIF, you earn 1 credit day of benefit, up to a maximum of 365 credit days. For example, 480 days worked earns 120 credit days. A claim uses credit days up.</desc>
  <rect width="720" height="300" rx="12" fill="#fcfcfb"/>
  <text x="40" y="44" font-size="20" font-weight="700" fill="#0b0b0b">How UIF credit days build up</text>
  <text x="40" y="68" font-size="14" fill="#52514e">Every 4 days you work and contribute earns 1 day of benefit.</text>

  <g fill="#2a78d6">
    <rect x="40" y="96" width="56" height="40" rx="4"/><rect x="104" y="96" width="56" height="40" rx="4"/>
    <rect x="168" y="96" width="56" height="40" rx="4"/><rect x="232" y="96" width="56" height="40" rx="4"/>
  </g>
  <g font-size="13" fill="#ffffff" text-anchor="middle">
    <text x="68" y="121">Work</text><text x="132" y="121">Work</text><text x="196" y="121">Work</text><text x="260" y="121">Work</text>
  </g>
  <text x="330" y="124" font-size="24" font-weight="700" fill="#52514e" text-anchor="middle">=</text>
  <rect x="370" y="96" width="120" height="40" rx="4" fill="#eb6834"/>
  <text x="430" y="121" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">1 credit day</text>

  <rect x="40" y="164" width="640" height="76" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <text x="60" y="192" font-size="15" font-weight="600" fill="#0b0b0b">Example: 480 days worked ÷ 4 = 120 credit days</text>
  <text x="60" y="218" font-size="14" fill="#52514e">Maximum: 365 credit days. A claim uses them up as you are paid.</text>

  <text x="40" y="282" font-size="12" fill="#52514e">Source: UIF fact sheet on calculating benefits, labour.gov.za. Not legal advice.</text>
</svg>
